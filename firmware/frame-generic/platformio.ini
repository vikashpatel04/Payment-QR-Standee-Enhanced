; Counter Pay frame-generic firmware: the PC renders every screen, the board only puts the
; pixels on the panel and enforces the safety rules (QR time limit, 10 s link loss) itself.
;
;   pio run -e esp32-waveshare-2in13-v4 -t upload --upload-port COM4
;
; Wiring, supported panels and flashing: docs/HARDWARE.md.

[platformio]
default_envs = esp32-waveshare-2in13-v4

[env]
platform = platformio/espressif32@6.13.0
framework = arduino
monitor_speed = 460800
upload_speed = 921600
lib_deps = zinggjm/GxEPD2@1.6.9
build_flags =
  -D CP_FW_VERSION=\"1.0.0\"
  -D CP_BAUD=460800
  ; Default wiring for ESP32 dev boards (NodeMCU-32, ESP32 DevKitC): VSPI CLK 18, DIN 23.
  -D CP_PIN_CS=5
  -D CP_PIN_DC=17
  -D CP_PIN_RST=16
  -D CP_PIN_BUSY=4

; Waveshare 2.13" e-Paper HAT V4 (250x122, SSD1680, flex cable FPC-A002)
[env:esp32-waveshare-2in13-v4]
board = esp32dev
build_flags = ${env.build_flags} -D CP_PANEL_2IN13_V4

; Waveshare 4.2" e-Paper V2 (400x300, SSD1683) - the recommended size for a counter
[env:esp32-waveshare-4in2]
board = esp32dev
build_flags = ${env.build_flags} -D CP_PANEL_4IN2_V2

; Waveshare 7.5" e-Paper V2 (800x480)
[env:esp32-waveshare-7in5]
board = esp32dev
build_flags = ${env.build_flags} -D CP_PANEL_7IN5_V2
