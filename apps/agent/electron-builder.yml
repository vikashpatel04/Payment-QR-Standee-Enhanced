# Per-user NSIS installer: no admin prompt. Start-at-login is set by the app itself on first run.
appId: org.counterpay.app
productName: Counter Pay
copyright: Copyright © 2026 Counter Pay contributors
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Only the Windows x64 binary of better-sqlite3 is needed, not its other platforms or SQLite sources.
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/better-sqlite3/{deps,src}/**'
  # The same for serialport: keep the Windows x64 prebuild only.
  - '!node_modules/@serialport/bindings-cpp/prebuilds/{android,darwin,linux}-*/**'
  - '!node_modules/@serialport/bindings-cpp/prebuilds/win32-{arm64,ia32}/**'
  - '!node_modules/@serialport/bindings-cpp/{src,binding.gyp}'
extraResources:
  - from: ../display/dist
    to: display
  - from: resources/icons
    to: icons
# better-sqlite3, koffi and serialport ship prebuilt Node-API binaries; nothing is rebuilt and no C++ toolchain is needed.
npmRebuild: false
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  artifactName: counter-pay-setup-${version}.${ext}
  # TODO: sign the installer and every update (SignPath Foundation or Azure Trusted Signing). Until then
  # Windows SmartScreen warns on first install, and electron-updater skips signature checks (SHA-512 still applies).
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Counter Pay
# electron-updater reads new versions from GitHub Releases of the repository named in
# package.json's "repository" field, so a fork that changes that field updates from its own releases.
# Each release carries the installer, its .blockmap (differential downloads) and latest.yml (version + SHA-512).
publish:
  provider: github
  releaseType: release
